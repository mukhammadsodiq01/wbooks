{% if field.errors %}
<div class="form-field has-error">
{% else %}
<div class="form-field">
{% endif %}
    <label for="{{ field.id_for_label }}">
        {{ field.label }}{% if field.field.required %}<span class="required-mark" aria-hidden="true">*</span>{% endif %}
    </label>
    {{ field }}
    {% if field.help_text %}
        <p class="field-help">{{ field.help_text|safe }}</p>
    {% endif %}
    {% for error in field.errors %}
        <p class="field-error">{{ error }}</p>
    {% endfor %}
</div>
